name: herbaapp
description: "Herba — smart greenhouse heater control."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # BLE controller discovery + WiFi provisioning
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1

  # HTTP API to the controller once on WiFi
  http: ^1.2.2

  # Local persistence
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
